[package]
name = "dynooh-minipixels"
version = "1.2.0"
description = "Dynooh MiniPixels – small, fast image viewer"
authors = ["Christian Tanner"]
license = "MIT"
repository = "https://github.com/Kwisso911/dynooh-minipixels"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows, cargo#8519).
name = "dynooh_minipixels_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
percent-encoding = "2"
id3 = "1"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

# Image decoding is unbearably slow without optimisation, also in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
